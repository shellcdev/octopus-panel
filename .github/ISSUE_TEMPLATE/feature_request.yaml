name: Feature request / 功能建议
description: 建议新功能或改进
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 这个需求背后的痛点是什么？（没有痛点也可以直接说想要什么）
      placeholder: 当……时，我希望……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你期望怎么实现？欢迎给草图或伪代码。
      placeholder: 可以这样做……
    validations:
      required: false
